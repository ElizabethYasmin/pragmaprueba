name: pruebapragma
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.8.0+1
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  json_annotation: ^4.9.0
  freezed_annotation: ^3.0.0
  get_it: ^8.0.3
  shimmer: ^3.0.0
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  lottie: ^3.3.1
  google_fonts: ^6.2.1
  flutter_launcher_icons: ^0.14.3

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.15
  json_serializable: ^6.9.4
  freezed: ^3.0.3

  flutter_lints: ^5.0.0


flutter_launcher_icons:
  android: true
  ios: true
  image_path_android: "assets/pragma.png"




flutter:
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Calligraffiti.ttf
        - asset: assets/fonts/FunSized.ttf
          weight: 700
  assets:
    - assets/cat_logo.png
    - assets/pragma.png



  uses-material-design: true
